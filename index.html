<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ea">
  <meta name="description" content="Story Sprout creates personalized, illustrated reading stories for kids using their name, interests, and reading goals — with built-in comprehension checks parents and teachers can trust.">
  <meta property="og:title" content="Story Sprout — Personalized reading stories for growing readers">
  <meta property="og:description" content="Turn a child's interests into an illustrated story that builds real reading skills, with auto-scored comprehension checks and adult-controlled privacy.">
  <meta property="og:type" content="website">
  <title>Story Sprout — Personalized reading stories for growing readers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#21383d; --muted:#607174; --paper:#fff7ea; --card:#fffdf9; --line:#eadbc9; --coral:#df7046; --sage:#dfead7; --sun:#f4c96d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#fff7ea 0%,#f1efe3 50%,#dcece4 100%); font-family:Georgia, 'Times New Roman', serif; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(1120px,100%); min-height:100vh; margin:auto; background:rgba(255,253,249,.78); box-shadow:0 0 48px rgba(46,73,65,.09); }
    header { height:84px; padding:0 clamp(20px,5vw,58px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:11px; font-size:24px; font-weight:bold; }
    .sprout { position:relative; width:32px; height:32px; border-radius:7px; background:var(--coral); background-image:radial-gradient(circle at 5px 9px,#fff7ea 0 2px,transparent 2.5px),radial-gradient(circle at 13px 6px,#fff7ea 0 2px,transparent 2.5px),radial-gradient(circle at 19px 6px,#fff7ea 0 2px,transparent 2.5px),radial-gradient(circle at 27px 9px,#fff7ea 0 2px,transparent 2.5px),radial-gradient(ellipse at 5px 17px,#fff7ea 0 3px,transparent 3.5px),radial-gradient(ellipse at 13px 14px,#fff7ea 0 3px,transparent 3.5px),radial-gradient(ellipse at 19px 14px,#fff7ea 0 3px,transparent 3.5px),radial-gradient(ellipse at 27px 17px,#fff7ea 0 3px,transparent 3.5px); }
    .sprout:before { content:''; position:absolute; width:8px; height:12px; border:2px solid var(--coral); border-left-color:#fff7ea; border-bottom-color:#fff7ea; border-radius:100% 0; left:12px; top:16px; transform:rotate(35deg); background:#fff7ea; }
    .nav { display:flex; gap:8px; }.nav button { border:0; background:transparent; color:var(--muted); font-weight:bold; padding:9px 12px; border-radius:5px; }.nav button.active { background:var(--sage); color:#325a41; }
    main { padding:clamp(28px,6vw,68px); }.hidden { display:none!important; }
    .eyebrow { color:#b95737; font-family:Arial,sans-serif; font-weight:bold; letter-spacing:1.5px; font-size:11px; }
    h1 { font-size:clamp(36px,5vw,58px); line-height:1.05; max-width:690px; margin:13px 0; letter-spacing:0; }
    .lede { color:var(--muted); font-size:18px; line-height:1.55; max-width:590px; margin:0 0 34px; }
    .composer { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:clamp(20px,4vw,36px); display:grid; grid-template-columns:1fr 1fr; gap:23px; box-shadow:0 14px 22px rgba(40,65,54,.05); }
    label { display:block; font-family:Arial,sans-serif; font-size:13px; color:var(--ink); font-weight:bold; margin-bottom:8px; } input,textarea { display:block; width:100%; border:1px solid #d8c8b5; background:#fffefa; border-radius:5px; color:var(--ink); padding:13px; font-size:16px; outline-color:var(--coral); } textarea { min-height:94px; resize:vertical; }
    .wide { grid-column:1/-1; }.themes { display:flex; flex-wrap:wrap; gap:8px; }.theme { border:1px solid #d8c8b5; color:var(--muted); background:#fffefa; border-radius:5px; padding:10px 12px; display:flex; align-items:center; gap:7px; font-family:Arial,sans-serif; font-size:13px; font-weight:bold; }.theme.active { color:var(--ink); border-color:var(--ink); background:#f6f1e8; }.swatch { height:11px; width:11px; border-radius:50%; background:#2d526b; }.theme:nth-child(2) .swatch{background:#477e50}.theme:nth-child(3) .swatch{background:#287ea1}.theme:nth-child(4) .swatch{background:#a85f42}
    .create { grid-column:1/-1; border:0; border-radius:5px; background:var(--coral); color:#fff; min-height:53px; font-family:Arial,sans-serif; font-size:16px; font-weight:bold; display:flex; align-items:center; justify-content:space-between; padding:0 19px; }.create:hover{background:#c85e3a}.note{grid-column:1/-1;text-align:center;color:#907f70;font:12px/1.4 Arial,sans-serif;margin-top:-12px}
    h2 { font-size:27px; margin:50px 0 15px; }.shelf { display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:17px; }.book { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card); padding:0; text-align:left; color:var(--ink); }.cover { height:157px; background:#2d526b; position:relative; overflow:hidden; }.cover .moon{position:absolute;width:58px;height:58px;background:#fce6aa;border-radius:50%;right:34px;top:23px}.cover .hill{position:absolute;width:130%;height:108px;border-radius:50%;bottom:-65px;left:-28px;background:#4f8969}.cover .house{position:absolute;width:57px;height:49px;bottom:28px;left:41%;background:#f0bd70}.cover .roof{position:absolute;width:0;height:0;border-left:37px solid transparent;border-right:37px solid transparent;border-bottom:30px solid #b95d42;top:-29px;left:-8px}.book-copy{padding:16px}.book h3{font-size:20px;line-height:1.15;margin:0 0 8px}.book p{font:14px Arial,sans-serif;color:var(--muted);margin:0}.open{font:13px Arial,sans-serif;color:#b95737;font-weight:bold;margin-top:14px;display:block}
    .library-heading { margin-bottom:35px; }.library-heading h1{margin-bottom:8px}.reader { max-width:780px; margin:auto; }.reader-cover { height:min(40vw,285px); min-height:185px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }.reader h1{font-size:clamp(29px,4vw,43px); margin-top:28px}.page-number{font:11px Arial,sans-serif;color:#b95737;font-weight:bold;letter-spacing:1.3px;margin-top:31px}.story-text{font-size:24px;line-height:1.6;color:#41565a;min-height:155px}.reader-controls { display:flex; align-items:center; justify-content:space-between; margin-top:25px; }.reader-controls button { border:0; border-radius:5px; min-height:45px; min-width:79px; padding:0 16px; background:var(--ink); color:#fff; font-family:Arial,sans-serif; font-weight:bold; }.reader-controls button:disabled{background:#c5cec7}.dots{display:flex;gap:8px}.dot{height:8px;width:8px;border-radius:50%;background:#d7cab9}.dot.active{width:22px;border-radius:6px;background:var(--coral)}.reader-tools{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}.text-action{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:0 0 3px;color:var(--ink);font:700 13px Arial,sans-serif}.danger{color:#a3402e;border-color:#a3402e}.library-empty{border:1px dashed #d7c8b7;padding:34px;text-align:center;color:var(--muted);font:16px/1.5 Arial,sans-serif}.toast{position:fixed;z-index:2;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:5px;font:13px Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(12px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:650px){header{height:72px}.composer{grid-template-columns:1fr}.wide{grid-column:auto}.create,.note{grid-column:auto}h1{font-size:38px}.story-text{font-size:20px}.reader-cover{height:210px}}
  </style>

  <link rel="stylesheet" href="enterprise.css">

  <link rel="stylesheet" href="deleted-stories.css">
  <link rel="stylesheet" href="reader.css">
  <link rel="stylesheet" href="mobile-nav.css">
  <link rel="stylesheet" href="story-preview.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="privacy.css">
  <link rel="stylesheet" href="assessment.css">
  <link rel="stylesheet" href="landing.css">
</head>

</html>
