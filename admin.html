<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link rel="icon" type="image/svg+xml" href="images/brand/favicon.svg">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --seq-250:#86b6ef; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-600:#184f95;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
  --brand:#df7046;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --s1:#3987e5; --s2:#d95926; --good-text:#0ca30c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand img{width:26px;height:26px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--ink2);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.spacer{flex:1}
select,input,button.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:6px 10px}
button.btn{cursor:pointer}
button.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.btn.danger{color:var(--critical);border-color:var(--critical)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--ink2);margin:0 0 16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.tile .label{color:var(--ink2);font-size:12px}
.tile .value{font-size:28px;font-weight:650;line-height:1.15;margin-top:2px}
.tile .note{color:var(--muted);font-size:12px;margin-top:2px}
.section{margin:26px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:650}
svg text{font-family:inherit}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 8px;border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.bars .row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;margin:6px 0}
.bars .name{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;position:relative}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.bars .num{font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--grid);color:var(--ink)}
.pill.free{background:color-mix(in srgb,var(--s1) 18%,transparent)}
.pill.paid{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good-text)}
.pill.ended{background:color-mix(in srgb,var(--critical) 16%,transparent)}
.pill.exempt{background:color-mix(in srgb,var(--s2) 20%,transparent)}
.sev{font-weight:600}
.sev.error{color:var(--critical)} .sev.warn{color:var(--serious)}
.hint{color:var(--muted);font-size:12px}
details summary{cursor:pointer;color:var(--ink2);font-size:12px;margin-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.field{display:grid;grid-template-columns:minmax(200px,1fr) minmax(160px,260px) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--grid)}
.field label{font-weight:600}
.field .help{color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{width:100%}
.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:6px 10px;min-height:70px}
.field.changed{background:color-mix(in srgb,var(--s1) 8%,transparent)}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);padding:18px;max-width:380px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:10px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;display:none;z-index:20}
.nf{max-width:420px;margin:18vh auto;text-align:center;color:var(--ink2)}
.sr{position:absolute;left:-9999px}
@media (max-width:700px){.field{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" hidden>
  <header>
    <div class="brand"><img src="images/brand/favicon.svg" alt=""><span>StoryAura Land · Admin</span></div>
    <nav id="tabs" role="tablist"></nav>
    <span class="spacer"></span>
    <label class="hint" for="range">Range</label>
    <select id="range" aria-label="Report range"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<div id="notfound" class="nf" hidden><h1>Page not found</h1><p>The page you are looking for does not exist.</p></div>
<dialog id="pw"><form method="dialog" id="pwform"><strong>Confirm it's you</strong><span class="hint" id="pwwhy"></span><input type="password" id="pwinput" autocomplete="current-password" placeholder="Your password" required><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="pwcancel">Cancel</button><button class="btn primary" type="submit">Confirm</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const token = (() => { try { return localStorage.getItem('storySproutToken'); } catch { return null; } })();
const nf = new Intl.NumberFormat('en-US');
const fmt = n => n === null || n === undefined ? 'n/a' : nf.format(Math.round(n));
const money = n => n === null || n === undefined ? 'n/a' : '$' + Number(n).toFixed(Number(n) < 10 ? 2 : 0);
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : 'n/a';
const hours = s => (Number(s || 0) / 3600).toFixed(1);
const dstr = v => v ? new Date(v).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'never';
const rel = v => { if (!v) return 'never'; const d = (Date.now() - new Date(v)) / 864e5; return d < 1 ? 'today' : d < 2 ? 'yesterday' : Math.floor(d) + ' days ago'; };
const bytes = n => n > 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(1) + ' MB';

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const svg = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v); return el; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); }

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (res.status === 404 || res.status === 401 || res.status === 403) { if (!opts.keepOn401 || res.status === 404) throw Object.assign(new Error('gone'), { gone: true }); }
  return res;
}
const getJSON = async path => { const r = await api(path); if (!r.ok) throw new Error('Request failed'); return r.json(); };

/* ---------- password prompt ---------- */
function askPassword(why) {
  return new Promise(resolve => {
    const dlg = $('#pw'), input = $('#pwinput');
    $('#pwwhy').textContent = why; input.value = '';
    let done = false;
    const finish = v => { if (done) return; done = true; dlg.close(); resolve(v); };
    $('#pwform').onsubmit = e => { e.preventDefault(); finish(input.value); };
    $('#pwcancel').onclick = () => finish(null);
    dlg.oncancel = () => finish(null);
    dlg.showModal(); input.focus();
  });
}
async function withPassword(why, send) {
  const password = await askPassword(why);
  if (!password) return null;
  const res = await send(password);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { toast(body.error || 'Something went wrong.'); return null; }
  return body;
}

/* ---------- chart pieces ---------- */
function tile(label, value, note) { return h('div', { class: 'card tile' }, h('div', { class: 'label' }, label), h('div', { class: 'value' }, value), note ? h('div', { class: 'note' }, note) : null); }

function lineChart(title, points, { unit = '', decimals = 0, total } = {}) {
  const W = 560, H = 170, L = 34, R = 14, T = 12, B = 24;
  const vals = points.map(p => Number(p.n));
  const max = Math.max(1, ...vals);
  const nice = max <= 4 ? Math.ceil(max) : Math.ceil(max / (10 ** (String(Math.ceil(max)).length - 1))) * 10 ** (String(Math.ceil(max)).length - 1);
  const x = i => L + (points.length === 1 ? 0 : i * (W - L - R) / (points.length - 1));
  const y = v => T + (H - T - B) * (1 - v / nice);
  const wrap = h('div', { class: 'chart' });
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': `${title}: ${points.length} days, total ${total ?? vals.reduce((a, b) => a + b, 0)}` });
  for (let t = 0; t <= 2; t++) {
    const v = nice * t / 2, yy = y(v);
    s.append(svg('line', { x1: L, x2: W - R, y1: yy, y2: yy, stroke: t === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
    const tx = svg('text', { x: L - 6, y: yy + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }); tx.textContent = decimals ? v.toFixed(decimals) : fmt(v); s.append(tx);
  }
  [0, Math.floor((points.length - 1) / 2), points.length - 1].forEach((i, k) => {
    const tx = svg('text', { x: x(i), y: H - 6, 'text-anchor': k === 0 ? 'start' : k === 2 ? 'end' : 'middle', 'font-size': 11, fill: 'var(--muted)' });
    tx.textContent = new Date(points[i].day + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); s.append(tx);
  });
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(Number(p.n)).toFixed(1)}`).join('');
  s.append(svg('path', { d, fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const last = points.length - 1;
  s.append(svg('circle', { cx: x(last), cy: y(vals[last]), r: 4.5, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }));
  const cross = svg('line', { y1: T, y2: H - B, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' }); s.append(cross);
  const dot = svg('circle', { r: 5, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' }); s.append(dot);
  const tip = h('div', { class: 'tip' });
  const hit = svg('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' });
  hit.addEventListener('mousemove', e => {
    const r = s.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(points.length - 1, Math.round((px - L) / ((W - L - R) / Math.max(1, points.length - 1)))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(vals[i])); dot.setAttribute('visibility', 'visible');
    tip.style.display = 'block'; tip.style.left = (x(i) / W * r.width) + 'px'; tip.style.top = (y(vals[i]) / H * r.height) + 'px';
    tip.textContent = `${new Date(points[i].day + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}: ${decimals ? vals[i].toFixed(decimals) : fmt(vals[i])}${unit}`;
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
  s.append(hit); wrap.append(s, tip);
  const rows = points.map(p => h('tr', null, h('td', null, p.day), h('td', { class: 'num' }, decimals ? Number(p.n).toFixed(decimals) : fmt(p.n))));
  return h('div', { class: 'card' }, h('h2', null, title), wrap, h('details', null, h('summary', null, 'View data'), h('div', { class: 'tablewrap', style: 'max-height:200px' }, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Day'), h('th', { class: 'num' }, title))), h('tbody', null, rows)))));
}

function barList(title, items, { colors, empty = 'No data yet', total } = {}) {
  const max = Math.max(1, ...(items || []).map(i => Number(i.n)));
  const body = !items || !items.length ? h('p', { class: 'hint' }, empty) : h('div', { class: 'bars' }, items.map((it, k) =>
    h('div', { class: 'row' }, h('span', { class: 'name', title: it.label }, it.label), h('span', { class: 'track' }, h('span', { class: 'fill', style: `width:${Number(it.n) / max * 100}%;background:${colors ? colors[Math.min(k, colors.length - 1)] : 'var(--s1)'}` })), h('span', { class: 'num' }, fmt(it.n), total ? ` · ${pct(it.n, total)}` : ''))));
  return h('div', { class: 'card' }, h('h2', null, title), body);
}

/* ---------- views ---------- */
const state = { tab: 'overview', days: 30, custPage: 1, custQ: '', custSort: 'newest', libStatus: 'draft', libPage: 1 };
const TABS = [['overview', 'Overview'], ['customers', 'Customers'], ['library', 'Library'], ['rules', 'Rules'], ['audit', 'Audit log'], ['system', 'System']];

function renderTabs() {
  const nav = $('#tabs'); nav.replaceChildren(...TABS.map(([id, label]) => h('button', { role: 'tab', 'aria-selected': String(state.tab === id), onclick: () => { state.tab = id; render(); } }, label)));
  const showRange = state.tab === 'overview';
  $('#range').style.display = showRange ? '' : 'none';
  document.querySelector('label[for="range"]').style.display = showRange ? '' : 'none';
}

async function viewOverview(root) {
  const o = await getJSON('/overview?days=' + state.days);
  const a = o.accounts || {}, l = o.learners || {}, s = o.stories || {}, ai = o.ai || {}, rd = o.reading || {}, as = o.assessments || {}, hk = o.housekeeping || {};
  root.append(h('h1', null, 'Site overview'), h('p', { class: 'sub' }, `Updated ${new Date(o.generatedAt).toLocaleString()} · charts show the last ${o.days} days`));

  root.append(h('div', { class: 'section' }, 'Customers'));
  root.append(h('div', { class: 'grid kpis' },
    tile('Accounts', fmt(a.total), `${fmt(a.parents)} parents · ${fmt(a.teachers)} teachers`),
    tile('New accounts', fmt(a.new7), `last 7 days · ${fmt(a.new1)} today · ${fmt(a.new30)} in 30 days`),
    tile('Email verified', pct(a.verified, a.total), `${fmt(a.verified)} of ${fmt(a.total)}`),
    tile('Paying customers', fmt(a.paid_active), a.demo_paid ? `${fmt(a.demo_paid)} on demo plans (not paying)` : 'active subscriptions'),
    tile('On free Explorer', fmt(a.free_active), `${fmt(a.free_ending3)} end within 3 days`),
    tile('Free period ended', fmt(a.free_expired), 'not paying'),
    tile('Never-limited accounts', fmt(a.exempt), 'owner and exempt list'),
    tile('Accounts with no learner', fmt(hk.accounts_without_learner), 'signed up but did not start')));

  root.append(h('div', { class: 'section' }, 'Activity'));
  root.append(h('div', { class: 'grid kpis' },
    tile('Learners', fmt(l.total), `${fmt(l.families)} families · ${fmt(l.with_child_login)} with a child login`),
    tile('Stories', fmt(s.total), `${fmt(s.new7)} this week · ${fmt(s.new1)} today`),
    tile('Stories finished', pct(s.completed, s.total), `${fmt(s.completed)} completed`),
    tile('Sibling copies', fmt(s.sibling_copies), 'shared stories'),
    tile('Reading time', hours(rd.seconds) + ' h', `${fmt(rd.sessions)} sessions · ${fmt(rd.accounts)} accounts`),
    tile('Story checks', fmt(as.total), `avg score ${Math.round(as.avg_score || 0)}% · ${fmt(as.mastered)} mastered · ${fmt(as.pending_review)} to review`),
    tile('Favorites', fmt(hk.favorites), hk.avg_rating ? `avg rating ${Number(hk.avg_rating).toFixed(1)}` : 'no ratings yet'),
    tile('Classroom imports', fmt(hk.classroom_imports), 'CSV roster uploads')));

  root.append(h('div', { class: 'section' }, 'AI usage & cost'));
  root.append(h('div', { class: 'grid kpis' },
    tile('AI cost this month', money(ai.month_cost), `${money(ai.total_cost)} all time (estimated)`),
    tile('AI calls this month', fmt(ai.month_calls), `${fmt(ai.month_accounts)} accounts · ${fmt(ai.total)} all time`),
    tile('Tokens this month', fmt((Number(ai.month_input_tokens) || 0) + (Number(ai.month_output_tokens) || 0)), `${fmt(ai.month_input_tokens)} in · ${fmt(ai.month_output_tokens)} out`),
    tile('Cost per account', ai.month_accounts ? money(ai.month_cost / ai.month_accounts) : 'n/a', 'this month, accounts using AI')));

  const sr = o.series || {};
  root.append(h('div', { class: 'section' }, 'Trends'));
  root.append(h('div', { class: 'grid two' },
    sr.signups ? lineChart('New accounts per day', sr.signups) : null,
    sr.stories ? lineChart('Stories created per day', sr.stories) : null,
    sr.aiCalls ? lineChart('AI calls per day', sr.aiCalls) : null,
    sr.aiCalls ? lineChart('AI cost per day (USD)', sr.aiCalls.map(p => ({ day: p.day, n: p.cost })), { unit: '', decimals: 2 }) : null,
    sr.readingMinutes ? lineChart('Reading minutes per day', sr.readingMinutes, { decimals: 0 }) : null,
    sr.weeklyActive ? lineChart('Active accounts per week (last 8 weeks)', sr.weeklyActive) : null));

  const f = o.funnel;
  if (f) root.append(h('div', { class: 'section' }, 'Customer journey'), h('div', { class: 'grid two' }, barList('From sign-up to paying (accounts)', [
    { label: 'Registered', n: f.registered }, { label: 'Verified email', n: f.verified }, { label: 'Added a learner', n: f.added_learner },
    { label: 'Created a story', n: f.created_story }, { label: 'Finished a story', n: f.finished_story }, { label: 'Paying', n: f.paid }],
    { colors: ['var(--seq-250)', 'var(--seq-300)', 'var(--seq-400)', 'var(--seq-450)', 'var(--seq-550)', 'var(--seq-600)'], total: f.registered }),
    barList('Plans (accounts)', (o.plans || []).map(p => ({ label: `${p.plan} · ${p.status}`, n: p.n })), { total: a.total })));

  root.append(h('div', { class: 'section' }, 'What people use'));
  root.append(h('div', { class: 'grid two' },
    barList('Story themes (top 10)', o.themes), barList('Reading focus', (o.domains || []).map(d => ({ label: d.label.replace(/_/g, ' '), n: d.n }))),
    barList('Learner age bands', o.ageBands), barList('Learner reading levels', o.readingLevels),
    barList('Where stories came from', o.sources),
    barList('AI spend by model this month (USD, estimated)', (o.models || []).map(m => ({ label: m.label + (m.unpriced ? ' (' + m.unpriced + ' unpriced)' : ''), n: Number(m.cost).toFixed(4) })), { empty: 'No AI calls this month' }), barList('Product events (' + o.days + ' days)', (o.growth || []).map(g => ({ label: g.label.replace(/_/g, ' '), n: g.n })))));

  root.append(h('div', { class: 'section' }, 'Health & safety'));
  const sevIcon = { error: '✖ Error', warn: '▲ Warning', info: '● Info' };
  root.append(h('div', { class: 'grid two' },
    barList('AI safety events (' + o.days + ' days)', (o.safety || []).map(g => ({ label: g.label.replace(/_/g, ' '), n: g.n })), { empty: 'None recorded' }),
    barList('Payment events, 30 days (Stripe webhook)', (o.webhooks || []), { empty: 'No payment events yet' }),
    barList('Server events by level (7 days)', (o.opsBySeverity || []), { empty: 'None recorded' }),
    h('div', { class: 'card' }, h('h2', null, 'Housekeeping'), h('div', { class: 'bars' },

async function viewRules(root) {
  const d = await getJSON('/settings');
  root.append(h('h1', null, 'Rules'), h('p', { class: 'sub' }, 'A value saved here is stored in the database and takes effect within about 30 seconds. If nothing is saved, the value comes from config/settings.json, then the built-in default. Saving asks for your password. In SQL: SELECT * FROM settings_overview.'));
  const groups = {}; d.settings.forEach(s => (groups[s.group] ||= []).push(s));
  const inputs = {};
  const changedMark = (row, el, s) => () => { row.classList.toggle('changed', JSON.stringify(read(el, s)) !== JSON.stringify(s.value)); };
  const read = (el, s) => s.type === 'int' || s.type === 'decimal' ? Number(el.value) : s.type === 'text' ? el.value.trim().toLowerCase() : s.type === 'emails' ? el.value.split(/[\s,;]+/).map(v => v.trim().toLowerCase()).filter(Boolean) : el.value;
  for (const [group, list] of Object.entries(groups)) {
    const card = h('div', { class: 'card', style: 'margin-bottom:12px' }, h('h2', null, group));
    for (const s of list) {
      let el;
      if (s.type === 'int') el = h('input', { type: 'number', min: s.min, max: s.max, step: 1, value: s.value });
      else if (s.type === 'decimal') el = h('input', { type: 'number', min: s.min, max: s.max, step: 0.001, value: s.value });
      else if (s.type === 'text') el = h('input', { type: 'text', value: s.value, maxlength: 60, spellcheck: 'false' });
      else if (s.type === 'choice') el = h('select', null, ...s.choices.map(c => h('option', { value: c, selected: c === s.value }, c)));
      else el = h('textarea', { spellcheck: 'false' }, s.value.join('\n'));
      inputs[s.key] = { el, s };
      const row = h('div', { class: 'field' },
        h('div', null, h('label', { for: 'f-' + s.key }, s.label), h('div', { class: 'help' }, s.help), h('div', { class: 'help' }, s.source === 'database' ? `Saved in the database by ${s.updatedBy || 'unknown'}` : s.source === 'file' ? 'Using the value from config/settings.json' : 'Using the built-in default')),
        el,
        h('button', { class: 'btn', type: 'button', disabled: s.source !== 'database', title: 'Remove the saved database value and fall back to the config file or built-in default', onclick: async () => {
          const out = await withPassword(`Reset "${s.label}" to its default?`, pw => api('/settings', { method: 'PUT', body: JSON.stringify({ changes: { [s.key]: null }, currentPassword: pw }) }));
          if (out) { toast('Reset to default.'); render(); } } }, 'Use default'));
      el.id = 'f-' + s.key; el.addEventListener('input', changedMark(row, el, s)); el.addEventListener('change', changedMark(row, el, s));
      card.append(row);
    }
    root.append(card);
  }
  root.append(h('div', { class: 'toolbar' }, h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    const changes = {}; for (const { el, s } of Object.values(inputs)) { const v = read(el, s); if (JSON.stringify(v) !== JSON.stringify(s.value)) changes[s.key] = v; }
    if (!Object.keys(changes).length) return toast('No changes to save.');
    const out = await withPassword('Save these rule changes? They apply to every customer.', pw => api('/settings', { method: 'PUT', body: JSON.stringify({ changes, currentPassword: pw }) }));
    if (out) { toast('Saved.'); render(); } } }, 'Save changes'),
    h('span', { class: 'hint' }, `Prefer SQL? Edit the app_settings table (key, value as JSON). Right now paid plans are ${d.pricingComingSoonNow ? '"Coming soon" (hidden and blocked)' : 'on sale'}.`)));
}

async function viewLibrary(root) {
  const [sum, list] = await Promise.all([getJSON('/library/summary'), getJSON(`/library?status=${state.libStatus}&page=${state.libPage}`)]);
  const run = sum.lastRun;
  root.append(h('h1', null, 'Story library'), h('p', { class: 'sub' }, 'Pre-made stories for families. Nothing here is shown to a family until you approve it. Read, listen, then approve or reject.'));
  root.append(h('div', { class: 'grid kpis' },
    tile('Waiting for your review', fmt(sum.draft), 'drafts'),
    tile('Approved', fmt(sum.approved), 'may be shown to families'),
    tile('Rejected', fmt(sum.rejected), 'never shown'),
    tile('Cost so far', money(sum.totalCost), 'writing, pictures and voice'),
    tile('Last build', run ? `${fmt(run.created)} made` : 'none yet', run ? `${fmt(run.failed)} failed · $${Number(run.cost_usd).toFixed(2)} of $${Number(run.budget_usd).toFixed(0)} budget` : '')));

  const filter = h('select', { 'aria-label': 'Show' }, ...[['draft', 'Waiting for review'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['all', 'All']].map(([v, t]) => h('option', { value: v, selected: state.libStatus === v }, t)));

    const out = await withPassword(`${verb} ${checks.size} ${checks.size === 1 ? 'story' : 'stories'}?`, pw => api('/library/review', { method: 'POST', body: JSON.stringify({ ids: [...checks], decision, currentPassword: pw }) }));

  };

  root.append(h('div', { class: 'toolbar', style: 'margin-top:16px' }, filter,
    h('button', { class: 'btn primary', type: 'button', onclick: () => bulk('approve') }, 'Approve ticked'),
    h('button', { class: 'btn danger', type: 'button', onclick: () => bulk('reject') }, 'Reject ticked'),
    h('button', { class: 'btn', type: 'button', onclick: () => bulk('draft') }, 'Move ticked back to waiting'),

    h('tbody', null, list.stories.map(s => {

      box.addEventListener('change', () => { if (box.checked) checks.add(s.id); else checks.delete(s.id); });
      return h('tr', null, h('td', null, box),
        h('td', null, h('button', { class: 'btn', type: 'button', style: 'text-align:left', onclick: () => openStory(s.id) }, s.title), h('div', { class: 'hint' }, s.slug)),
        h('td', null, s.grade_level), h('td', null, s.domain.replace(/_/g, ' ')), h('td', null, s.theme), h('td', null, pill(s.status)),
        h('td', null, s.has_cover ? 'yes' : 'no'), h('td', { class: 'num' }, fmt(s.audio_pages)), h('td', { class: 'num' }, s.attempts || ''), h('td', { class: 'num' }, '$' + Number(s.cost_usd).toFixed(3)));
    }))) : h('p', { class: 'hint' }, 'No stories here yet.')));
  const pages = Math.max(1, Math.ceil(list.total / list.pageSize));

    h('button', { class: 'btn', type: 'button', disabled: state.libPage >= pages, onclick: () => { state.libPage++; render(); } }, 'Next')));

      pagesBox.replaceChildren(...c[version.value].pages.map((p, i) => h('div', { style: 'margin:10px 0' },
        h('div', { style: 'font:400 17px/1.55 Georgia,serif' }, h('b', null, `Page ${i + 1}. `), fill(p)),
        version.value === 'solo' && a.pages && a.pages[i] ? h('audio', { controls: true, preload: 'none', src: a.pages[i], style: 'height:34px;margin-top:4px' }) : null)));

        h('div', { class: 'hint' }, q.options.map(o => (o === q.answer ? '✔ ' : '• ') + o).join('   ')),
        a.questions && a.questions[i] ? h('audio', { controls: true, preload: 'none', src: a.questions[i], style: 'height:34px' }) : null)),

      story.review_note ? h('div', { class: 'hint' }, 'Review note: ' + story.review_note) : null,
      h('div', { class: 'toolbar', style: 'margin-top:14px' }, note,

const VIEWS = { overview: viewOverview, customers: viewCustomers, library: viewLibrary, rules: viewRules, audit: viewAudit, system: viewSystem };
async function render() {
  renderTabs();
  const root = $('#view'); root.replaceChildren(h('p', { class: 'hint' }, 'Loading…'));
  try {
    const next = h('div'); await VIEWS[state.tab](next); root.replaceChildren(...next.childNodes);
  } catch (e) { if (e.gone) return showGone(); root.replaceChildren(h('div', { class: 'card' }, h('strong', null, 'Could not load this page.'), h('p', { class: 'hint' }, 'Try Refresh. If it keeps happening, check the server logs.'))); console.error(e); }
}
function showGone() { $('#app').hidden = true; $('#notfound').hidden = false; document.title = 'Not found'; }

$('#range').addEventListener('change', e => { state.days = Number(e.target.value); render(); });
$('#refresh').addEventListener('click', render);
if (!token) showGone();
else { $('#app').hidden = false; render(); }
})();
